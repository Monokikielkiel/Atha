<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTAH ATHA</title>

    <style>
        body {
            background-color: #4998b5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        #saturnCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            /* Agar tombol tetap bisa diklik */
            z-index: 99;
        }

        h1 {
            color: #333;
        }

        .card {
            background-color: #71a2c5;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            weight: bold;
            height: auto;
            font-size: 18px;
        }

        .img {
            border-radius: 50%;
            margin: 20px 0;
            border-color: aqua;
            border-width: 3px;
            border-style: solid;

        }

        .love {
            color: red;
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .awal {
            background-color: #f9f9f9;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            font-size: 18px;
        }

        .btn-saturn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-saturn:hover {
            background-color: #00b0ff;
        }
    </style>
</head>

<body>

    <canvas id="saturnCanvas"></canvas>
    <div class="awal">

        <h1>first of all, happy birthday Atha!</h1>

        <script>
            // JavaScript untuk menampilkan pesan selamat ulang tahun
            alert("Selamat Ulang Tahun, Atha! Semoga hari ini menyenangkan!");
        </script>
    </div>

    <div class="card">
        <div class="love">❤️🎂❤️</div>

        <h1>HAPPYY BIRTHDAY MY SATURNNNN</h1>
        <img src="atha.jpg" alt="foto atha" width="200" class="img">
        <p>28 september yeyyyy,hari ulang tahun yuuu yang ke 16 tahunnn

        </p>
        <p>I ALWAYS LOVEE UUU SAYANGGGG</p>
        <button class="btn-saturn" onclick="mulaiHujanSaturnus()">Hujani Saturnus 🪐✨</button>
    </div>
    <script>
        const canvas = document.getElementById('saturnCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let saturns = [];
        let isRaining = false;

        class Saturn {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -50 - Math.random() * 200;
                this.radius = 12 + Math.random() * 15;
                this.speed = 2 + Math.random() * 4;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.05;

                // Warna planet acak bernuansa luar angkasa
                const colors = ['#f4e04d', '#e5c158', '#d4a359', '#ce9248', '#fce38a'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.speed;
                this.angle += this.spin;

                // Reset posisi jika keluar dari layar bawah
                if (this.y > canvas.height + 50) {
                    this.y = -50;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(0.3); // Kemiringan Saturnus

                // Bagian Belakang Cincin
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 2.2, this.radius * 0.6, 0, Math.PI, 0, true);
                ctx.strokeStyle = 'rgba(230, 200, 160, 0.7)';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Badan Planet
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Tekstur/Garis Planet
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, -0.4, 0.4);
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Bagian Depan Cincin
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 2.2, this.radius * 0.6, 0, 0, Math.PI, true);
                ctx.strokeStyle = 'rgba(240, 220, 180, 0.9)';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.restore();
            }
        }

        function animate() {
            if (!isRaining) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            saturns.forEach(s => {
                s.update();
                s.draw();
            });

            requestAnimationFrame(animate);
        }

        function mulaiHujanSaturnus() {
            if (!isRaining) {
                isRaining = true;
                saturns = [];
                // Buat 45 planet Saturnus
                for (let i = 0; i < 45; i++) { saturns.push(new Saturn()); } animate(); setTimeout(() => {
                    alert("I Love You to Saturn and Back! 🪐❤️");
                }, 300);
            } else {
                // Tambahkan lebih banyak planet jika ditekan lagi
                for (let i = 0; i < 15; i++) { saturns.push(new Saturn()); }
            }
        } </script>


</body>


</body>

</html>
